services:
  postgres:
    image: postgres:16
    container_name: escola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: escola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escola"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - escola_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: escola-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/escola
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  escola_data:
