services:
  postgres:
    image: postgres:16
    container_name: escola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: escola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - escola_data:/var/lib/postgresql/data
volumes:
  escola_data:
